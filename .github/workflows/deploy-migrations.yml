name: Deploy Prisma migrations

on:
  workflow_dispatch:
    inputs:
      project_ref:
        description: Supabase project ref
        required: true
        default: gvpahzqwzqublfntsopf
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: deploy-prisma-migrations
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy pending migrations
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production

    steps:
      - name: Verify project target
        env:
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          PROJECT_REF: ${{ inputs.project_ref }}
        run: |
          if [ "$PROJECT_REF" != "gvpahzqwzqublfntsopf" ]; then
            echo "Expected project ref gvpahzqwzqublfntsopf."
            exit 1
          fi
          if [ -z "$DIRECT_URL" ]; then
            echo "DIRECT_URL secret is not configured."
            exit 1
          fi
          python - <<'PY'
          import os
          from urllib.parse import urlparse

          direct_url = os.environ["DIRECT_URL"]
          project_ref = os.environ["PROJECT_REF"]
          parsed = urlparse(direct_url)
          target = f"{parsed.hostname or ''} {parsed.username or ''}"
          if project_ref not in target:
              raise SystemExit(
                  "DIRECT_URL does not identify the expected Supabase project."
              )
          PY

      - name: Verify successful CI for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request

          repo = os.environ["GITHUB_REPOSITORY"]
          sha = os.environ["GITHUB_SHA"]
          query = urllib.parse.urlencode(
              {"branch": "main", "head_sha": sha, "status": "success", "per_page": 100}
          )
          request = urllib.request.Request(
              f"https://api.github.com/repos/{repo}/actions/workflows/ci.yml/runs?{query}",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "pranax-migration-deploy",
              },
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              payload = json.load(response)
          if not payload.get("workflow_runs"):
              raise SystemExit(
                  "No successful CI run exists for this main-branch commit."
              )
          PY

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@12.14.0 --activate

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Inspect migration status
        env:
          DATABASE_URL: ${{ secrets.DIRECT_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: corepack pnpm db:migrate:status

      - name: Deploy pending migrations
        env:
          DATABASE_URL: ${{ secrets.DIRECT_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: corepack pnpm db:migrate:deploy
