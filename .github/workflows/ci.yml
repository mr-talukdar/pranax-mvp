name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: postgresql://pranax_app:ci-placeholder@127.0.0.1:54322/postgres?schema=public
  DIRECT_URL: postgresql://postgres:ci-placeholder@127.0.0.1:54322/postgres
  NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-publishable-key
  INTELLIGENCE_URL: http://127.0.0.1:8000
  INTELLIGENCE_SERVICE_TOKEN: ci-placeholder-service-token-at-least-32-characters

jobs:
  ci:
    name: Node and Python checks
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@12.14.0 --activate

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Validate Prisma schema
        run: corepack pnpm db:validate

      - name: Generate Prisma client
        run: corepack pnpm db:generate

      - name: Run workspace tests
        run: corepack pnpm test

      - name: Run TypeScript checks
        run: corepack pnpm typecheck

      - name: Run lint
        run: corepack pnpm lint

      - name: Build Next.js application
        run: corepack pnpm build

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "services/intelligence[test]"
          python -m pip install -e "tools/synthetic-data[test]"

      - name: Test intelligence service
        run: python -m pytest services/intelligence/tests -q

      - name: Test synthetic data factory
        run: python -m pytest tools/synthetic-data/tests -q
