[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pranax-synthetic-data"
version = "0.1.0"
description = "Deterministic, database-free synthetic studio data factory for PranaX"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
test = ["pytest==8.4.2"]

[project.scripts]
pranax-synthetic-data = "synthetic_data.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
